<!DOCTYPE html>
<html>
<head>
    <title>Bootstrap Offset Example</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>

<div class="container mt-5">

    <div class="row mb-4">
        <div class="col-4 bg-primary text-white text-center p-3">
            Box 1
        </div>

        <div class="col-4 offset-4 bg-success text-white text-center p-3">
            Box 2
        </div>
    </div>

    <div class="row mb-4">
        <div class="col-3 offset-2 bg-danger text-white text-center p-3">
            Box 3
        </div>

        <div class="col-3 offset-1 bg-warning text-dark text-center p-3">
            Box 4
        </div>
    </div>

    <div class="row">
        <div class="col-6 offset-3 bg-info text-white text-center p-3">
            Centered Box
        </div>
    </div>

</div>

</body>
</html>
